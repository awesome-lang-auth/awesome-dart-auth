name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test (Dart 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.0"

      - name: Install dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Check that melos sees every package
        run: |
          dart run melos list --parsable | tee /tmp/melos-packages.txt
          count=$(grep -cE '/(packages|examples)/' /tmp/melos-packages.txt || true)
          echo "melos packages: $count"
          if [ "$count" -lt 5 ]; then
            echo '::error::melos found fewer than 5 packages; analyze and test would run on nothing'
            exit 1
          fi

      - name: Analyze
        run: dart run melos exec --fail-fast -- dart analyze .

      - name: Test
        run: dart run melos exec --fail-fast --dir-exists=test -- dart test
