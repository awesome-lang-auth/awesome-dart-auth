name: Publish to pub.dev

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to pub.dev
    runs-on: ubuntu-latest
    environment: pubdev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.0"

      - name: Install dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Check that melos sees every package
        run: |
          dart run melos list --parsable | tee /tmp/melos-packages.txt
          count=$(grep -cE '/(packages|examples)/' /tmp/melos-packages.txt || true)
          expected=$(git ls-files 'packages/*/pubspec.yaml' 'examples/*/pubspec.yaml' | wc -l)
          echo "melos packages: $count, tracked package pubspecs: $expected"
          if [ "$expected" -gt 0 ] && [ "$count" -eq "$expected" ]; then
            echo 'melos sees every package under packages/ and examples/'
          else
            echo '::error::melos does not see every package under packages/ and examples/; list each one under workspace: in the root pubspec.yaml'
            exit 1
          fi

      - name: Run checks before publishing
        run: |
          dart run melos exec --fail-fast -- dart analyze .
          dart run melos exec --fail-fast --dir-exists=test -- dart test

      - name: Configure pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.pub-cache"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"

      - name: Publish package
        run: |
          cd packages/awesome_dart_auth
          dart pub publish --force
